name: Destroy

# Destrucción manual de todos los entornos
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribí "destroy" para confirmar'
        required: true
        type: string
      solo_listar:
        description: 'Solo listar los entornos, sin destruir'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC

# Compartido con deploy.yml (docs/Concurrencia.md)
concurrency:
  group: production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar ejecución
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow solo se ejecuta desde main."
            exit 1
          fi
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Confirmación incorrecta. Escribí exactamente: destroy"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
          terraform_wrapper: false

      - name: Listar entornos de preview
        id: listar
        run: |
          keys=$(aws s3api list-objects-v2 --bucket "$TF_STATE_BUCKET" --prefix previews/ \
                   --query "Contents[?ends_with(Key, '/terraform.tfstate')].Key" --output text)

          # previews/pr-<n>/terraform.tfstate -> pr-<n>
          envs=""
          for k in $keys; do
            [ "$k" = "None" ] && continue
            n="${k#previews/}"
            envs="$envs ${n%%/*}"
          done
          envs="${envs# }"

          echo "Entornos encontrados: ${envs:-ninguno}"
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

      - name: Destruir entornos de preview
        if: ${{ !inputs.solo_listar && steps.listar.outputs.envs != '' }}
        working-directory: infra/preview
        env:
          ENVS: ${{ steps.listar.outputs.envs }}
        run: |
          borrar_imagenes() {
            local tags ids=() failures
            tags=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
                     --filter tagStatus=TAGGED \
                     --query "imageIds[?starts_with(imageTag, '$1-')].imageTag" \
                     --output text)
            if [ -z "$tags" ] || [ "$tags" = "None" ]; then
              echo "No hay imágenes $1-* en ECR"
              return 0
            fi
            for t in $tags; do ids+=("imageTag=$t"); done
            failures=$(aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" \
                         --image-ids "${ids[@]}" --query 'length(failures)' --output text)
            [ "$failures" = "0" ]
          }

          fallidos=""
          for env_name in $ENVS; do
            echo "::group::$env_name"
            # State e imágenes se borran solo si el destroy salió bien
            if terraform init -input=false -reconfigure \
                 -backend-config="bucket=${TF_STATE_BUCKET}" \
                 -backend-config="key=previews/${env_name}/terraform.tfstate" \
               && terraform destroy -auto-approve -input=false -lock-timeout=5m \
                    -var "env_name=${env_name}" \
               && aws s3 rm "s3://${TF_STATE_BUCKET}/previews/${env_name}/terraform.tfstate" \
               && borrar_imagenes "$env_name"; then
              echo "$env_name destruido"
            else
              fallidos="$fallidos $env_name"
            fi
            echo "::endgroup::"
          done

          if [ -n "$fallidos" ]; then
            echo "::error::Fallaron:$fallidos"
            exit 1
          fi
