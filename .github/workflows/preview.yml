name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write       # OIDC: GitHub emite el token para asumir el rol en AWS
  contents: read        # checkout del código
  pull-requests: write  # crear/editar el comentario del preview

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ENV_NAME: pr-${{ github.event.pull_request.number }}  # formato que valida infra/preview/variables.tf
  PR_NUMBER: ${{ github.event.pull_request.number }}    # solo el número: etiqueta pr=<n> (variables.tf valida ^[0-9]+$)
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}   # commit real del PR (no el merge commit)
  TF_IN_AUTOMATION: "true"                             # salida de Terraform sin sugerencias interactivas
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}            # repo compartido de ECR (previewpanda)

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del commit del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}  # evita depender de refs/pull/<n>/merge (no existe si hay conflictos)

      - name: Asumir rol por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}  # sin claves: solo el ARN del rol
          aws-region: ${{ vars.AWS_REGION }}

      # Login al registry privado: el rol del OIDC pide un token temporal a ECR
      # (sin usuario ni contraseña guardados) y deja docker autenticado
      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Arma el tag y la URI, y consulta si esa imagen ya está en ECR.
      # El repo es IMMUTABLE: un segundo push del mismo tag falla, así que si ya
      # existe (reapertura del PR o re-run del mismo commit) se reutiliza.
      - name: Calcular tag y verificar si existe en ECR
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}  # 891762599659.dkr.ecr.us-east-1.amazonaws.com
        run: |
          # Formato del tag (provisorio, a confirmar con A y C): cambiarlo SOLO acá.
          # Si cambia el prefijo, ajustar también PREFIX en destroy-preview.yml.
          IMAGE_TAG="${ENV_NAME}-${HEAD_SHA::7}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Distingue "no existe" de cualquier otro error (permisos, red):
          # solo ImageNotFoundException habilita el build; lo demás corta el job
          if out=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                     --image-ids imageTag="$IMAGE_TAG" 2>&1); then
            echo "La imagen $IMAGE_TAG ya existe en ECR: se saltea build y push"
            exists=true
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "La imagen $IMAGE_TAG no existe en ECR: se construye y se sube"
            exists=false
          else
            echo "$out"
            exit 1
          fi

          {
            echo "tag=${IMAGE_TAG}"
            echo "uri=${IMAGE_URI}"
            echo "exists=${exists}"
          } >> "$GITHUB_OUTPUT"

      # Build y push solo si el tag es nuevo; con tag existente el paso aparece como "skipped"
      - name: Build y push de la imagen
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          # --provenance=false: imagen simple (sin índice OCI de attestations),
          # que es el formato que acepta Lambda
          docker build --provenance=false -t "$IMAGE_URI" app/
          docker push "$IMAGE_URI"

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x  # use_lockfile (backend.tf) requiere >= 1.11
          terraform_wrapper: false   # sin wrapper para que `output -raw` devuelva solo el valor

      - name: Terraform init (state propio del PR)
        working-directory: infra/preview
        run: |
          # La key de backend.tf (pr-1) se pisa acá: un state por PR
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=previews/${ENV_NAME}/terraform.tfstate"

      - name: Terraform apply
        id: tf
        working-directory: infra/preview
        run: |
          # TODO(A): cuando existan en variables.tf y la Lambda use imagen, agregar:
          #   -var "commit_sha=${HEAD_SHA}"
          #   -var "image_uri=${{ steps.image.outputs.uri }}"
          # -lock-timeout: si otro proceso (ej. plan de calidad) tiene el lock, espera en vez de fallar
          terraform apply -auto-approve -input=false -lock-timeout=5m \
            -var "env_name=${ENV_NAME}" \
            -var "pr_number=${PR_NUMBER}"  # sin esto Terraform usa el default "1" y todo queda pr=1
          # URL pública de la Lambda, para el comentario del PR
          echo "url=$(terraform output -raw function_url)" >> "$GITHUB_OUTPUT"

      - name: Comentar URL en el PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.tf.outputs.url }}  # output function_url del apply
          IMAGE_TAG: ${{ steps.image.outputs.tag }}  # tag de la imagen en ECR
        with:
          script: |
            // Marcador oculto para reconocer "nuestro" comentario
            const marker = '<!-- preview-panda -->';
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            // Link al commit desplegado (head del PR, no el merge commit)
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;

            const body = [
              marker,
              '### Entorno de preview',
              '',
              `**PR:** #${pr.number} · **Entorno:** \`pr-${pr.number}\``,
              `**URL:** ${process.env.PREVIEW_URL}`,
              `**Commit:** [\`${sha.substring(0, 7)}\`](${commitUrl})`,
              `**Imagen:** \`${process.env.IMAGE_TAG}\``,
              `**Actualizado:** ${new Date().toISOString()}`,
            ].join('\n');

            // Buscar si ya existe un comentario con el marcador
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              // Ya existe -> lo edito (no duplico)
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Comentario ${existing.id} actualizado`);
            } else {
              // Primera vez -> lo creo
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Comentario creado');
            }

      # TODO(CSV): registrar la creación en docs/environments.csv
      #            (PR, fecha, commit). Falta acordar con C cómo, porque main está protegido.

      # Si cualquier paso anterior falló, el comentario no debe seguir mostrando
      # la URL/commit viejos como si estuvieran actualizados
      - name: Marcar comentario como fallido
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-panda -->';
            const pr = context.payload.pull_request;
            // Link al run para ver qué paso falló
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '### Entorno de preview',
              '',
              `**PR:** #${pr.number} · **Entorno:** \`pr-${pr.number}\``,
              `**Estado:** falló el despliegue del commit \`${pr.head.sha.substring(0, 7)}\``,
              `**Detalle:** [ver run](${runUrl})`,
              `**Actualizado:** ${new Date().toISOString()}`,
            ].join('\n');

            // Misma lógica que el comentario normal: editar si existe, crear si no
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
