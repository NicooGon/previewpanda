name: Preview

# Crea o actualiza el entorno de preview del PR y publica URL y plan en un comentario.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write       # OIDC hacia AWS
  contents: write       # checkout y push de la fila a registro/environments
  pull-requests: write  # comentario del PR

# Mismo grupo que destroy-preview.yml (ver docs/Concurrencia.md)
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ENV_NAME: pr-${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  preview:
    # El PR del registro solo trae el CSV
    if: github.head_ref != 'registro/environments'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del commit del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Autenticar en AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag pr-<n>-<sha7>; si la imagen ya existe en ECR (repo IMMUTABLE) se reutiliza
      - name: Calcular tag y verificar si existe en ECR
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${ENV_NAME}-${HEAD_SHA::7}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          if out=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                     --image-ids imageTag="$IMAGE_TAG" 2>&1); then
            echo "La imagen $IMAGE_TAG ya existe en ECR"
            exists=true
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "La imagen $IMAGE_TAG no existe en ECR"
            exists=false
          else
            echo "$out"
            exit 1
          fi

          {
            echo "tag=${IMAGE_TAG}"
            echo "uri=${IMAGE_URI}"
            echo "exists=${exists}"
          } >> "$GITHUB_OUTPUT"

      - name: Build y push de la imagen
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          docker build --provenance=false -t "$IMAGE_URI" app/
          docker push "$IMAGE_URI"

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/preview
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=previews/${ENV_NAME}/terraform.tfstate"

      - name: Terraform plan
        id: plan
        working-directory: infra/preview
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan \
            -var "env_name=${ENV_NAME}" \
            -var "commit_sha=${HEAD_SHA}" \
            -var "image_uri=${IMAGE_URI}"
          terraform show -no-color tfplan > plan.txt
          summary=$(grep -m1 -E '^(Plan:|No changes\.)' plan.txt || echo "ver detalle")
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        id: tf
        working-directory: infra/preview
        run: |
          terraform apply -input=false -lock-timeout=5m tfplan
          echo "url=$(terraform output -raw function_url)" >> "$GITHUB_OUTPUT"

      # Fila created (opened/reopened) o updated (synchronize) en docs/environments.csv
      - name: Registrar entorno en el CSV
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event.action == 'synchronize' && 'updated' || 'created' }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          PREVIEW_URL: ${{ steps.tf.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/registrar_entorno.sh "$EVENT" "$IMAGE_TAG" "$PREVIEW_URL" \
            "commit=${HEAD_SHA::7} run=${RUN_URL}"

      # URL, commit, imagen y plan si el job salió bien; aviso de fallo si no
      - name: Comentar en el PR
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PREVIEW_URL: ${{ steps.tf.outputs.url }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          PLAN_SUMMARY: ${{ steps.plan.outputs.summary }}
          PLAN_FILE: infra/preview/plan.txt
        with:
          script: |
            const comentar = require(`${process.env.GITHUB_WORKSPACE}/scripts/comentario_pr.js`);
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}`;
            const header = `**PR:** #${pr.number} · **Entorno:** \`pr-${pr.number}\``;
            const fecha = `**Actualizado:** ${new Date().toISOString()}`;

            if (process.env.JOB_STATUS !== 'success') {
              await comentar({ github, context, lines: [
                header,
                `**Estado:** falló el despliegue del commit \`${sha.substring(0, 7)}\``,
                `**Detalle:** [ver run](${runUrl})`,
                fecha,
              ]});
              return;
            }

            // Límite de GitHub: 65536 caracteres por comentario
            const MAX_PLAN = 60000;
            let plan = require('fs').readFileSync(process.env.PLAN_FILE, 'utf8').trim();
            if (plan.length > MAX_PLAN) {
              plan = plan.slice(0, MAX_PLAN) + `\n... (truncado, plan completo en el run: ${runUrl})`;
            }

            await comentar({ github, context, lines: [
              header,
              `**URL:** ${process.env.PREVIEW_URL}`,
              `**Commit:** [\`${sha.substring(0, 7)}\`](${repoUrl}/commit/${sha})`,
              `**Imagen:** \`${process.env.IMAGE_TAG}\``,
              fecha,
              '',
              `<details><summary>Plan de Terraform: ${process.env.PLAN_SUMMARY}</summary>`,
              '',
              '```',
              plan,
              '```',
              '</details>',
            ]});
