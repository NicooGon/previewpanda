name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      # TODO: reemplazar por auth WIF + docker build/push + terraform apply
      - name: Simular apply
        id: fake
        run: |
          echo "Simulando apply del PR ${{ github.event.pull_request.number }}..."
          sleep 60   # para poder probar la concurrencia con dos pushes seguidos
          echo "url=https://pr-${{ github.event.pull_request.number }}.ejemplo.com" >> "$GITHUB_OUTPUT"

      - name: Comentar URL en el PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.fake.outputs.url }}
        with:
          script: |
            // Marcador oculto para reconocer "nuestro" comentario
            const marker = '<!-- preview-panda -->';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = [
              marker,
              '### Entorno de preview',
              '',
              `**URL:** ${process.env.PREVIEW_URL}`,
              `**Commit:** \`${sha}\``,
              `**Actualizado:** ${new Date().toISOString()}`,
            ].join('\n');

            // Buscar si ya existe un comentario con el marcador
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              // Ya existe -> lo edito (no duplico)
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Comentario ${existing.id} actualizado`);
            } else {
              // Primera vez -> lo creo
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Comentario creado');
            }