name: Terraform Quality

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/preview

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -reconfigure -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Instalar TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Ejecutar TFLint
        run: |
          tflint --init
          tflint

      - name: Ejecutar Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Comentar resultado del plan
        uses: actions/github-script@v7
        env:
          PLAN_RESULT: ${{ steps.plan.outcome }}
        with:
          script: |
            const marker = '<!-- terraform-quality-plan -->';
            const body = [
              marker,
              '### Resultado de Terraform quality',
              '',
              `Terraform plan: **${process.env.PLAN_RESULT}**`,
              '',
              'Se ejecutaron fmt, validate, tflint, Checkov y plan.'
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              }
            );

            const existing = comments.find(
              comment => comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

            if (process.env.PLAN_RESULT !== 'success') {
              core.setFailed('Terraform plan terminó con errores');
            }
