name: Destroy preview

on:
  pull_request:
    types: [closed]  # cubre cerrado y mergeado

permissions:
  id-token: write       # OIDC hacia AWS
  contents: read        # checkout del código de infra
  pull-requests: write  # editar el comentario

# Mismo grupo que preview.yml: si hay un apply corriendo, el destroy espera a que termine
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ENV_NAME: pr-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}  # mismo valor que el apply
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  TF_IN_AUTOMATION: "true"
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}  # repo compartido de ECR (previewpanda)

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del commit del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}  # mismo código que hizo el apply; sigue accesible aunque borren la rama

      - name: Asumir rol por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
          terraform_wrapper: false

      - name: Terraform init (state del PR)
        working-directory: infra/preview
        run: |
          # Misma key que el apply; si el state no existe, init igual funciona
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=previews/${ENV_NAME}/terraform.tfstate"

      - name: Terraform destroy
        id: destroy
        working-directory: infra/preview
        run: |
          # Con state vacío (apply nunca corrió) termina OK sin borrar nada;
          # con apply a medias borra solo lo que quedó registrado
          # TODO(A): agregar -var commit_sha/image_uri cuando existan
          #          (si no tienen default, destroy también los exige)
          # pr_number: mismas variables que el apply, por si A le saca el default
          terraform destroy -auto-approve -input=false -lock-timeout=5m \
            -var "env_name=${ENV_NAME}" \
            -var "pr_number=${PR_NUMBER}"

      - name: Borrar el state del PR en S3
        # Sin `if:` → solo corre si el destroy (y todo lo anterior) salió bien.
        # Si el destroy falla, el state se conserva para reintentar o para el nightly.
        run: |
          # Idempotente: si la key no existe (apply nunca corrió), no falla
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/previews/${ENV_NAME}/terraform.tfstate"

      - name: Borrar imágenes del PR en ECR
        # Sin `if:` → solo si el destroy salió bien: si falló, la Lambda puede
        # seguir usando la imagen y se conserva junto con el state.
        run: |
          # Debe coincidir con el inicio de IMAGE_TAG en preview.yml (pr-<n>-<sha7>).
          # El guion final evita que pr-1- también agarre pr-14-..., pr-15-...
          PREFIX="${ENV_NAME}-"

          # Tags del PR; la CLI recorre todas las páginas y filtra con JMESPath
          tags=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
                   --filter tagStatus=TAGGED \
                   --query "imageIds[?starts_with(imageTag, '${PREFIX}')].imageTag" \
                   --output text)

          # Sin imágenes (el build nunca corrió o ya se borraron): no es error
          if [ -z "$tags" ] || [ "$tags" = "None" ]; then
            echo "No hay imágenes ${PREFIX}* en ECR"
            exit 0
          fi

          # Una entrada imageTag=<tag> por imagen (máximo 100 por llamada;
          # la lifecycle deja 10, así que alcanza)
          ids=()
          for t in $tags; do ids+=("imageTag=$t"); done
          echo "Borrando: $tags"

          # batch-delete-image devuelve 0 aunque falle alguna: se revisa `failures`
          failures=$(aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" \
                       --image-ids "${ids[@]}" --query 'length(failures)' --output text)
          if [ "$failures" != "0" ]; then
            echo "No se pudieron borrar $failures imágenes"
            exit 1
          fi

      # TODO(CSV): registrar la destrucción en docs/environments.csv (PR, fecha, horas de vida)

      - name: Actualizar comentario del PR
        if: always()  # siempre: también tiene que avisar si el destroy falló
        uses: actions/github-script@v7
        env:
          # success solo si OIDC, init, destroy y borrado del state salieron bien
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- preview-panda -->';
            const pr = context.payload.pull_request;
            const ok = process.env.JOB_STATUS === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '### Entorno de preview',
              '',
              `**PR:** #${pr.number} (${pr.merged ? 'mergeado' : 'cerrado'}) · **Entorno:** \`pr-${pr.number}\``,
              ok
                ? '**Entorno destruido** (recursos, state e imágenes eliminados)'
                : `**Falló el destroy:** pueden quedar recursos de \`pp-pr-${pr.number}\` ([ver run](${runUrl}))`,
              `**Fecha:** ${new Date().toISOString()}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              // Caso raro: el apply nunca llegó a comentar
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
