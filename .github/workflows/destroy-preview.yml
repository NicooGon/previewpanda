name: Destroy preview

# Destruye el entorno de preview al cerrar o mergear el PR.
on:
  pull_request:
    types: [closed]

permissions:
  id-token: write       # OIDC hacia AWS
  contents: write       # checkout y push de la fila a registro/environments
  pull-requests: write  # comentario del PR

# Mismo grupo que preview.yml (ver docs/Concurrencia.md)
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ENV_NAME: pr-${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  destroy:
    # El PR del registro no tiene entorno
    if: github.head_ref != 'registro/environments'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del commit del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Autenticar en AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
          terraform_wrapper: false

      - name: Destruir entorno
        run: bash scripts/destruir_entorno.sh "$ENV_NAME"

      # Fila destroyed con lifetime_hours y estimated_cost_usd
      - name: Registrar destrucción en el CSV
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          COST_PER_HOUR: ${{ vars.PREVIEW_COST_USD_PER_HOUR }}
          CLOSE_STATE: ${{ github.event.pull_request.merged && 'mergeado' || 'cerrado' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/registrar_entorno.sh destroyed "" "" "${CLOSE_STATE} run=${RUN_URL}"

      - name: Comentar en el PR
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const comentar = require(`${process.env.GITHUB_WORKSPACE}/scripts/comentario_pr.js`);
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.JOB_STATUS === 'success';

            await comentar({ github, context, lines: [
              `**PR:** #${pr.number} (${pr.merged ? 'mergeado' : 'cerrado'}) · **Entorno:** \`pr-${pr.number}\``,
              ok
                ? '**Entorno destruido** (recursos, state e imágenes eliminados)'
                : `**Falló el destroy:** pueden quedar recursos de \`pp-pr-${pr.number}\` ([ver run](${runUrl}))`,
              `**Fecha:** ${new Date().toISOString()}`,
            ]});
